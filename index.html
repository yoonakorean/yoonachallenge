<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種雲端遊戲化學習系統</title>
    
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Firebase 設定檔 -->
    <script src="js/firebase-config.js"></script>

    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-gray: #e5e7eb;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-gold: #f59e0b;
            --duo-lightning: #a5b4fc;
            --duo-fire-red: #ef4444;
        }

        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh;
            background: #ffffff; display: flex; flex-direction: column; position: relative;
            box-sizing: border-box;
        }

        .user-meta-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; background: #ffffff; border-bottom: 2px solid #e5e7eb;
            font-size: 0.88rem; white-space: nowrap; position: relative; z-index: 100;
        }

        .user-meta-item {
            display: inline-flex; align-items: center; gap: 5px; font-weight: bold;
            color: #374151; cursor: pointer; padding: 6px 8px; border-radius: 10px;
            user-select: none; position: relative;
        }

        .btn-3d {
            font-size: 0.9rem !important; font-weight: bold; border: none;
            border-radius: 16px; cursor: pointer; transition: all 0.1s ease;
            user-select: none; touch-action: manipulation;
        }
        
        .btn-3d-primary { background: var(--duo-green); color: white; box-shadow: 0 4px 0 var(--duo-green-shadow); }
        .btn-3d-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--duo-green-shadow); }
        .btn-3d-secondary { background: #ffffff; color: #4b5563; border: 2px solid #e5e7eb; box-shadow: 0 4px 0 #e5e7eb; }
        .btn-3d-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }

        .btn-google {
            background: #ffffff; color: #374151; border: 2px solid #e5e7eb;
            box-shadow: 0 4px 0 #e5e7eb; display: flex; align-items: center;
            justify-content: center; gap: 10px; width: 100%; padding: 12px;
            font-size: 1rem; font-weight: bold; border-radius: 16px; cursor: pointer;
        }
        .btn-google:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }

        .map-container { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 15px; width: 100%; box-sizing: border-box; }
        .unit-card { width: 100%; background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f3f4f6; box-sizing: border-box; }

        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .custom-modal-card { background: white; border-radius: 24px; padding: 24px 20px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); position: relative; box-sizing: border-box; }

        .close-icon-circle { position: absolute; top: 14px; left: 16px; width: 28px; height: 28px; background: #f3f4f6; color: #9ca3af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; }

        .tab-btn { flex: 1; padding: 10px; border: none; background: #ffffff; color: #6b7280; border-radius: 12px; cursor: pointer; border: 1px solid #e5e7eb; font-weight: bold; }
        .tab-btn.active { background: var(--duo-blue); color: white; border-color: var(--duo-blue); box-shadow: 0 3px 0 var(--duo-blue-shadow); }

        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px 12px; margin: 6px 0; border-radius: 12px; border: 2px solid #e5e7eb; box-sizing: border-box; font-size: 0.95rem; }

        .unit-header-bar {
            background: var(--duo-green); color: #fff; border-radius: 16px;
            padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 18px; border: none; width: 100%; text-align: left; box-sizing: border-box;
        }
        .unit-header-bar .unit-header-title { font-weight: 800; font-size: 1rem; }
        
        .activity-column { display: flex; flex-direction: row; justify-content: space-around; align-items: center; gap: 10px; margin-bottom: 10px; }
        .activity-node-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .activity-node {
            width: 60px; height: 60px; border-radius: 50%; border: none; position: relative;
            background: var(--duo-blue); color: #fff; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-blue-shadow); display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        .activity-node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--duo-blue-shadow); }
        .activity-node.status-locked { background: #d1d5db !important; color: #9ca3af !important; box-shadow: 0 4px 0 #b0b6bf !important; cursor: not-allowed; }
        .activity-node.status-completed { background: var(--duo-gold) !important; color: #fff !important; box-shadow: 0 4px 0 #b45309 !important; }
        .activity-label { font-size: 0.75rem; font-weight: bold; color: #4b5563; text-align: center; }
        .score-badge { font-size: 0.7rem; color: #15803d; font-weight: 800; background: #dcfce7; padding: 2px 6px; border-radius: 8px; margin-top: 2px; }

        .leaderboard-list { text-align: left; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
        .leaderboard-item:first-child { font-weight: bold; color: var(--duo-gold); }
    </style>
</head>
<body>

    <!-- 🔑 1. 登入/註冊 Modal -->
    <div class="custom-modal" id="login-modal">
        <div class="custom-modal-card">
            <div style="font-size: 2.5rem; color: var(--duo-blue); margin-bottom: 10px;"><i class="fa-solid fa-graduation-cap"></i></div>
            <h3 style="margin: 0 0 8px 0;" id="modal-auth-title">歡迎來到多語種大冒險</h3>
            <p style="font-size: 0.85rem; color:#6b7280; margin-bottom: 15px;">請選擇登入方式開始學習</p>
            
            <button class="btn-google" id="btn-google-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google">
                使用 Google 帳號登入
            </button>

            <div style="display:flex; align-items:center; gap:10px; margin: 16px 0;">
                <div style="flex:1; height:1px; background:#e5e7eb;"></div>
                <span style="font-size:0.78rem; color:#9ca3af;">或使用 Email</span>
                <div style="flex:1; height:1px; background:#e5e7eb;"></div>
            </div>

            <div style="display:flex; gap:8px; background:#f3f4f6; padding:6px; border-radius:14px; margin-bottom: 10px;">
                <button class="tab-btn active" id="tab-login">登入</button>
                <button class="tab-btn" id="tab-register">註冊帳號</button>
            </div>

            <input type="email" id="email-input" placeholder="電子信箱" autocomplete="username">
            <input type="password" id="password-input" placeholder="密碼" autocomplete="current-password">
            <button class="btn-3d btn-3d-primary" id="btn-auth-submit" style="width:100%; padding:10px; margin-top: 6px;">登入</button>

            <div style="margin-top: 10px;">
                <button id="btn-forgot-password" style="border:none; background:none; color:var(--duo-blue); cursor:pointer; font-size:0.82rem;">忘記密碼？</button>
            </div>

            <div id="login-error-msg" style="color: var(--duo-red); font-size: 0.82rem; margin-top: 12px;" class="hidden"></div>
        </div>
    </div>

    <!-- 👤 2. 個人檔案 Modal -->
    <div id="modal-profile" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-profile-modal"><i class="fa-solid fa-xmark"></i></div>
            <div style="font-size: 3rem; color: var(--duo-blue); margin-bottom: 10px; margin-top: 10px;"><i class="fa-solid fa-circle-user"></i></div>
            <h3 id="profile-display-name" style="margin: 0 0 4px 0;">使用者</h3>
            <p id="profile-display-email" style="font-size: 0.82rem; color: #6b7280; margin-bottom: 20px;">email@example.com</p>
            <button id="btn-logout" class="btn-3d" style="width: 100%; padding: 10px; background: var(--duo-red); color: white; box-shadow: 0 4px 0 var(--duo-red-shadow);">登出帳號</button>
        </div>
    </div>

    <!-- 🏆 3. 排行榜 Modal -->
    <div id="modal-leaderboard" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-leaderboard-modal"><i class="fa-solid fa-xmark"></i></div>
            <div style="font-size: 2.5rem; color: var(--duo-gold); margin-bottom: 6px; margin-top: 6px;"><i class="fa-solid fa-trophy"></i></div>
            <h3 style="margin: 0 0 4px 0;">積分排行榜</h3>
            <div id="leaderboard-content" class="leaderboard-list">
                <div style="text-align:center; color:#9ca3af; padding:20px;">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 🔒 4. 鎖定關卡提示 Modal -->
    <div id="modal-locked" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div style="font-size: 2.8rem; color: #f59e0b; margin-bottom: 10px;"><i class="fa-solid fa-lock"></i></div>
            <h3 style="margin: 0 0 8px 0; color: #1f2937;">關卡鎖定中</h3>
            <p style="margin: 0 0 20px 0; color: #6b7280; font-size: 0.85rem;">需要先完成前置關卡才能解鎖唷！</p>
            <button id="btn-close-locked-modal" class="btn-3d btn-3d-primary" style="width: 100%; padding: 10px;">我知道了</button>
        </div>
    </div>

    <!-- 📖 5. 課前暖身 Modal -->
    <div id="modal-warmup-ask" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-warmup-ask"><i class="fa-solid fa-xmark"></i></div>
            <div style="font-size: 2.5rem; color: var(--duo-blue); margin-bottom: 10px; margin-top: 10px;"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 style="margin: 0 0 8px 0; color: #1f2937;">課前暖身</h3>
            <p style="margin: 0 0 20px 0; color: #6b7280; font-size: 0.9rem;">進入挑戰前，要先複習必備單字嗎？</p>
            <div style="display: flex; gap: 10px;">
                <button id="btn-warmup-yes" class="btn-3d btn-3d-primary" style="flex: 1; padding: 10px;">進入暖身</button>
                <button id="btn-warmup-no" class="btn-3d btn-3d-secondary" style="flex: 1; padding: 10px;">直接挑戰</button>
            </div>
        </div>
    </div>

    <!-- 🎓 6. 切換程度 Modal -->
    <div id="modal-select-initial-level" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-level-modal"><i class="fa-solid fa-xmark"></i></div>
            <h3 style="margin: 10px 0 8px 0; color: #1f2937;">選擇課程程度</h3>
            <select id="initial-level-select" style="font-weight: bold; margin-bottom: 15px;">
                <option value="0A">0A 入門級 A</option>
                <option value="0B">0B 入門級 B</option>
                <option value="1A" selected>1A 基礎級 A</option>
                <option value="1B">1B 基礎級 B</option>
                <option value="2A">2A 初級 A</option>
                <option value="2B">2B 初級 B</option>
                <option value="3A">3A 中級 A</option>
                <option value="3B">3B 中級 B</option>
                <option value="4A">4A 高級 A</option>
                <option value="4B">4B 高級 B</option>
            </select>
            <button id="btn-confirm-initial-level" class="btn-3d btn-3d-primary" style="width: 100%; padding: 10px;">確定切換</button>
        </div>
    </div>

    <!-- 🎮 主應用畫面 -->
    <div class="app-container hidden" id="main-app">
        <div class="user-meta-bar">
            <div class="user-meta-item" id="btn-profile-trigger">
                <i class="fa-solid fa-user" style="color: var(--duo-blue); font-size: 1.05rem;"></i>
                <span id="lbl-username">使用者</span>
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-fire" style="color: var(--duo-fire-red); font-size: 1.05rem;"></i>
                <span id="lbl-login-days">1</span> 天
            </div>

            <div class="user-meta-item" id="btn-leaderboard-trigger">
                <i class="fa-solid fa-star" style="color: var(--duo-gold); font-size: 1.05rem;"></i>
                <span id="lbl-xp">0</span>
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-bolt-lightning" style="color: var(--duo-lightning); font-size: 1.05rem;"></i>
                <span id="lbl-energy">100</span>
            </div>

            <div class="user-meta-item" id="btn-level-trigger">
                <span id="lbl-user-level" style="color: var(--duo-blue);">1A</span>
                <i class="fa-solid fa-caret-down" style="font-size: 0.75rem; color: #9ca3af;"></i>
            </div>
        </div>

        <!-- 關卡地圖 -->
        <div id="map-view" class="map-container">
            <div id="units-map-list" style="width: 100%; display: flex; flex-direction: column; gap: 16px;"></div>
        </div>

        <!-- 遊戲視圖 -->
        <div id="game-view" class="hidden map-container" style="padding: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px;">
                <button id="btn-back-to-map" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                    <i class="fa-solid fa-arrow-left"></i> 返回地圖
                </button>
                <h3 id="game-title" style="margin: 0; font-size: 0.95rem; color: #1f2937;">挑戰進行中</h3>
            </div>
            <div id="activity-player-content" style="width:100%; height: 82vh; border-radius: 16px; overflow: hidden; border: 2px solid #e5e7eb;"></div>
        </div>
    </div>

    <script>
        // 1. 1A 程度 17 個單元資料庫生成
        const units1A = [];
        for (let i = 1; i <= 17; i++) {
            const numStr = i < 10 ? '0' + i : i;
            units1A.push({
                unitNum: i,
                title: `第 ${i} 單元：句子綜合挑戰`,
                stages: [
                    {
                        name: `${i}-1 跟讀`,
                        code: `11-${i}-1 句子跟讀挑戰`,
                        icon: 'fa-microphone',
                        link: `https://yoonakorean.github.io/11${numStr}01SS/`,
                        reqUnlock: null
                    },
                    {
                        name: `${i}-1 填空`,
                        code: `11-${i}-1 句子填空挑戰`,
                        icon: 'fa-pen-to-square',
                        link: `https://yoonakorean.github.io/11${numStr}01SF/`,
                        reqUnlock: null
                    },
                    {
                        name: `${i}-1 聽打`,
                        code: `11-${i}-1 句子聽打挑戰`,
                        icon: 'fa-keyboard',
                        link: `https://yoonakorean.github.io/11${numStr}01ST/`,
                        reqUnlock: `11-${i}-1 句子填空挑戰`
                    }
                ]
            });
        }

        const coursesConfig = { "0A": [], "0B": [], "1A": units1A, "1B": [], "2A": [], "2B": [], "3A": [], "3B": [], "4A": [], "4B": [] };

        let currentSelectedStage = null;
        let cachedUserScores = {};
        let currentLevel = "1A";
        let isAuthRegisterMode = false;
        let db = null;

        // 2. 統一初始化與事件綁定
        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            bindEventListeners();
        });

        function initAuth() {
            if (typeof firebase !== 'undefined' && firebase.auth) {
                db = firebase.firestore();

                firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        document.getElementById('login-modal').classList.add('hidden');
                        document.getElementById('main-app').classList.remove('hidden');

                        const displayName = user.displayName || user.email.split('@')[0];
                        document.getElementById('lbl-username').innerText = displayName;
                        document.getElementById('profile-display-name').innerText = displayName;
                        document.getElementById('profile-display-email').innerText = user.email;

                        listenToUserScores(user.uid);
                    } else {
                        document.getElementById('login-modal').classList.remove('hidden');
                        document.getElementById('main-app').classList.add('hidden');
                    }
                });
            } else {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                renderCourseMap(currentLevel);
            }
        }

        function bindEventListeners() {
            // 登入 / 註冊 Tab 切換
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const btnAuthSubmit = document.getElementById('btn-auth-submit');

            if (tabLogin && tabRegister) {
                tabLogin.addEventListener('click', () => {
                    isAuthRegisterMode = false;
                    tabLogin.classList.add('active');
                    tabRegister.classList.remove('active');
                    btnAuthSubmit.innerText = '登入';
                });

                tabRegister.addEventListener('click', () => {
                    isAuthRegisterMode = true;
                    tabRegister.classList.add('active');
                    tabLogin.classList.remove('active');
                    btnAuthSubmit.innerText = '註冊並登入';
                });
            }

            // 提交登入/註冊
            btnAuthSubmit?.addEventListener('click', () => {
                const email = document.getElementById('email-input').value.trim();
                const password = document.getElementById('password-input').value.trim();
                const errorMsg = document.getElementById('login-error-msg');

                errorMsg.classList.add('hidden');
                if (!email || !password) {
                    errorMsg.innerText = '請輸入 Email 與密碼';
                    errorMsg.classList.remove('hidden');
                    return;
                }

                if (isAuthRegisterMode) {
                    firebase.auth().createUserWithEmailAndPassword(email, password).catch(err => {
                        errorMsg.innerText = err.message;
                        errorMsg.classList.remove('hidden');
                    });
                } else {
                    firebase.auth().signInWithEmailAndPassword(email, password).catch(err => {
                        errorMsg.innerText = '帳號或密碼錯誤';
                        errorMsg.classList.remove('hidden');
                    });
                }
            });

            // Google 登入
            document.getElementById('btn-google-login')?.addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider).catch(err => {
                    const errorMsg = document.getElementById('login-error-msg');
                    errorMsg.innerText = err.message;
                    errorMsg.classList.remove('hidden');
                });
            });

            // 忘記密碼
            document.getElementById('btn-forgot-password')?.addEventListener('click', () => {
                const email = document.getElementById('email-input').value.trim();
                if (!email) {
                    alert('請先輸入信箱');
                    return;
                }
                firebase.auth().sendPasswordResetEmail(email).then(() => {
                    alert('重設密碼信件已寄出！');
                }).catch(err => alert(err.message));
            });

            // 登出
            document.getElementById('btn-logout')?.addEventListener('click', () => {
                firebase.auth().signOut().then(() => {
                    document.getElementById('modal-profile').classList.add('hidden');
                });
            });

            // 個人 Modal
            document.getElementById('btn-profile-trigger')?.addEventListener('click', () => {
                document.getElementById('modal-profile').classList.remove('hidden');
            });
            document.getElementById('btn-close-profile-modal')?.addEventListener('click', () => {
                document.getElementById('modal-profile').classList.add('hidden');
            });

            // 課前暖身 Modal 按鈕
            document.getElementById('btn-warmup-yes')?.addEventListener('click', () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
                if (currentSelectedStage) launchStageGame(currentSelectedStage);
            });
            document.getElementById('btn-warmup-no')?.addEventListener('click', () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
                if (currentSelectedStage) launchStageGame(currentSelectedStage);
            });
            document.getElementById('btn-close-warmup-ask')?.addEventListener('click', () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
            });

            // 鎖定提示 Modal
            document.getElementById('btn-close-locked-modal')?.addEventListener('click', () => {
                document.getElementById('modal-locked').classList.add('hidden');
            });

            // 返回地圖
            document.getElementById('btn-back-to-map')?.addEventListener('click', () => {
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('map-view').classList.remove('hidden');
                document.getElementById('activity-player-content').innerHTML = '';
            });

            // 切換程度
            document.getElementById('btn-level-trigger')?.addEventListener('click', () => {
                document.getElementById('modal-select-initial-level').classList.remove('hidden');
            });
            document.getElementById('btn-close-level-modal')?.addEventListener('click', () => {
                document.getElementById('modal-select-initial-level').classList.add('hidden');
            });
            document.getElementById('btn-confirm-initial-level')?.addEventListener('click', () => {
                const selectedLvl = document.getElementById('initial-level-select').value;
                currentLevel = selectedLvl;
                document.getElementById('lbl-user-level').innerText = selectedLvl;
                renderCourseMap(selectedLvl);
                document.getElementById('modal-select-initial-level').classList.add('hidden');
            });

            // 排行榜 Modal
            document.getElementById('btn-leaderboard-trigger')?.addEventListener('click', () => {
                document.getElementById('modal-leaderboard').classList.remove('hidden');
                loadLeaderboard();
            });
            document.getElementById('btn-close-leaderboard-modal')?.addEventListener('click', () => {
                document.getElementById('modal-leaderboard').classList.add('hidden');
            });
        }

        // 3. 讀取與監聽成績
        function listenToUserScores(uid) {
            if (!db) return;

            db.collection('users').doc(uid).collection('scores').onSnapshot((snapshot) => {
                cachedUserScores = {};
                let totalXP = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const score = data.score || 0;
                    cachedUserScores[doc.id] = score;
                    totalXP += score;
                });

                document.getElementById('lbl-xp').innerText = totalXP;
                renderCourseMap(currentLevel);
            }, (error) => {
                console.log("成績讀取失敗:", error);
                renderCourseMap(currentLevel);
            });
        }

        // 4. 排行榜
        function loadLeaderboard() {
            if (!db) return;
            const content = document.getElementById('leaderboard-content');
            content.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">載入中...</div>';

            db.collection('users').orderBy('totalXP', 'desc').limit(10).get().then((snapshot) => {
                if (snapshot.empty) {
                    content.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">尚無排行榜資料</div>';
                    return;
                }

                let html = '';
                let rank = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="leaderboard-item">
                            <div><strong>#${rank}</strong> ${data.displayName || '匿名玩家'}</div>
                            <div><i class="fa-solid fa-star" style="color:var(--duo-gold);"></i> ${data.totalXP || 0}</div>
                        </div>
                    `;
                    rank++;
                });
                content.innerHTML = html;
            }).catch(() => {
                content.innerHTML = '<div style="text-align:center; color:#9ca3af; padding:20px;">暫時無法讀取排行榜</div>';
            });
        }

        // 5. 繪製關卡地圖
        function renderCourseMap(level = "1A") {
            const container = document.getElementById('units-map-list');
            if (!container) return;
            container.innerHTML = '';

            const currentCourseData = coursesConfig[level] || [];

            if (currentCourseData.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:60px 0; font-weight:bold;">${level} 程度關卡籌備中，敬請期待！</div>`;
                return;
            }

            currentCourseData.forEach(unit => {
                const card = document.createElement('div');
                card.className = 'unit-card';

                card.innerHTML = `
                    <div class="unit-header-bar">
                        <div class="unit-header-title">${unit.title}</div>
                        <div style="font-size:0.85rem;"><i class="fa-solid fa-book"></i> 單元 11-${unit.unitNum}-1</div>
                    </div>
                `;

                const col = document.createElement('div');
                col.className = 'activity-column';

                unit.stages.forEach(stage => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'activity-node-wrapper';

                    const btn = document.createElement('button');
                    btn.className = 'activity-node';

                    const score = cachedUserScores[stage.code] || 0;
                    let isLocked = false;

                    if (stage.reqUnlock) {
                        const parentScore = cachedUserScores[stage.reqUnlock] || 0;
                        if (parentScore <= 0) isLocked = true;
                    }

                    if (isLocked) {
                        btn.classList.add('status-locked');
                        btn.innerHTML = `<i class="fa-solid fa-lock"></i>`;
                        btn.onclick = () => {
                            document.getElementById('modal-locked').classList.remove('hidden');
                        };
                    } else {
                        if (score >= 80) btn.classList.add('status-completed');
                        btn.innerHTML = `<i class="fa-solid ${stage.icon}"></i>`;
                        btn.onclick = () => {
                            currentSelectedStage = stage;
                            document.getElementById('modal-warmup-ask').classList.remove('hidden');
                        };
                    }

                    wrapper.appendChild(btn);

                    const lbl = document.createElement('div');
                    lbl.className = 'activity-label';
                    lbl.innerText = stage.name;
                    wrapper.appendChild(lbl);

                    if (score > 0) {
                        const badge = document.createElement('div');
                        badge.className = 'score-badge';
                        badge.innerText = `${score}分`;
                        wrapper.appendChild(badge);
                    }

                    col.appendChild(wrapper);
                });

                card.appendChild(col);
                container.appendChild(card);
            });
        }

        // 開啟遊戲
        function launchStageGame(stage) {
            document.getElementById('map-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');

            document.getElementById('game-title').innerText = stage.code;
            document.getElementById('activity-player-content').innerHTML = `
                <iframe src="${stage.link}" style="width:100%; height:100%; border:none;" allow="microphone; autoplay;"></iframe>
            `;
        }
    </script>
</body>
</html>
