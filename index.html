<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種雲端遊戲化學習系統</title>
    
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-gray: #e5e7eb;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-gold: #f59e0b;
            --duo-lightning: #a5b4fc;
            --duo-fire-red: #ef4444;
        }

        body {
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh;
            background: #ffffff; display: flex; flex-direction: column; position: relative;
            box-sizing: border-box;
        }

        /* 頂部資訊列 */
        .user-meta-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; background: #ffffff; border-bottom: 2px solid #e5e7eb;
            font-size: 0.88rem; white-space: nowrap; position: relative; z-index: 100;
        }

        .user-meta-item {
            display: inline-flex; align-items: center; gap: 5px; font-weight: bold;
            color: #374151; cursor: pointer; padding: 6px 8px; border-radius: 10px;
            user-select: none; position: relative;
        }

        .notification-badge {
            position: absolute; top: 2px; right: 2px; width: 10px; height: 10px;
            background-color: var(--duo-red); border-radius: 50%; border: 2px solid white;
        }

        .btn-3d, .stage-btn-3d, .tab-btn {
            font-size: 0.9rem !important; font-weight: bold; border: none;
            border-radius: 16px; cursor: pointer; transition: all 0.1s ease;
            user-select: none; touch-action: manipulation;
        }
        
        .btn-3d-primary { background: var(--duo-green); color: white; box-shadow: 0 4px 0 var(--duo-green-shadow); }
        .btn-3d-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--duo-green-shadow); }
        .btn-3d-secondary { background: #ffffff; color: #4b5563; border: 2px solid #e5e7eb; box-shadow: 0 4px 0 #e5e7eb; }
        .btn-3d-secondary:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }

        .btn-google {
            background: #ffffff; color: #374151; border: 2px solid #e5e7eb;
            box-shadow: 0 4px 0 #e5e7eb; display: flex; align-items: center;
            justify-content: center; gap: 10px; width: 100%; padding: 12px;
            font-size: 1rem; font-weight: bold; border-radius: 16px; cursor: pointer;
        }
        .btn-google:active { transform: translateY(2px); box-shadow: 0 1px 0 #e5e7eb; }

        .map-container { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 15px; width: 100%; box-sizing: border-box; }
        .unit-card { width: 100%; background: #ffffff; border: 2px solid #e5e7eb; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #f3f4f6; box-sizing: border-box; }

        .custom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .custom-modal-card { background: white; border-radius: 24px; padding: 24px 20px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); position: relative; box-sizing: border-box; }

        .close-icon-circle { position: absolute; top: 14px; left: 16px; width: 28px; height: 28px; background: #f3f4f6; color: #9ca3af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; }

        .tab-btn { flex: 1; padding: 10px; border: none; background: #ffffff; color: #6b7280; border-radius: 12px; cursor: pointer; border: 1px solid #e5e7eb; }
        .tab-btn.active { background: var(--duo-blue); color: white; border-color: var(--duo-blue); box-shadow: 0 3px 0 var(--duo-blue-shadow); }

        .nav-tab-btn { padding: 6px 12px; border: 2px solid #e5e7eb; background: #f9fafb; color: #6b7280; border-radius: 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .nav-tab-btn.active { background: var(--duo-blue); color: white; border-color: var(--duo-blue-shadow); }

        .rank-card-box { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 16px; padding: 16px; margin-top: 12px; }

        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px 12px; margin: 6px 0; border-radius: 12px; border: 2px solid #e5e7eb; box-sizing: border-box; font-size: 0.95rem; }

        /* 地圖關卡樣式 */
        .unit-header-bar {
            background: var(--duo-green); color: #fff; border-radius: 16px;
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 18px; width: 100%; box-sizing: border-box;
        }
        .unit-header-bar .unit-header-title { font-weight: 800; font-size: 1rem; }

        .activity-column { display: flex; flex-direction: row; justify-content: space-around; align-items: center; gap: 10px; margin-bottom: 10px; }
        .activity-node-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .activity-node {
            width: 60px; height: 60px; border-radius: 50%; border: none; position: relative;
            background: var(--duo-blue); color: #fff; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 4px 0 var(--duo-blue-shadow); display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        .activity-node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--duo-blue-shadow); }
        .activity-node.status-locked {
            background: #d1d5db !important; color: #9ca3af !important; box-shadow: 0 4px 0 #b0b6bf !important; cursor: not-allowed;
        }
        .activity-node.status-completed {
            background: var(--duo-gold) !important; color: #fff !important; box-shadow: 0 4px 0 #b45309 !important;
        }
        .activity-label { font-size: 0.75rem; font-weight: bold; color: #4b5563; text-align: center; }
        .score-badge { font-size: 0.7rem; color: #15803d; font-weight: 800; background: #dcfce7; padding: 2px 6px; border-radius: 8px; margin-top: 2px; }

        /* 排行榜表格 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
        th { background-color: #f3f4f6; }
        .gold { background-color: #fff7c2; }
        .self-row { background-color: #e0f2fe; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 🔑 1. 登入視窗 -->
    <div class="custom-modal hidden" id="login-modal">
        <div class="custom-modal-card">
            <div style="font-size: 2.5rem; color: var(--duo-blue); margin-bottom: 10px;"><i class="fa-solid fa-graduation-cap"></i></div>
            <h3 style="margin: 0 0 8px 0;">歡迎參加韓國語挑戰賽</h3>
            <p style="font-size: 0.85rem; color:#6b7280; margin-bottom: 15px;">請輸入您的暱稱以記錄分數與排名</p>
            
            <input type="text" id="nickname-input" placeholder="請輸入您的姓名 / 暱稱">
            <button class="btn-3d btn-3d-primary" id="btn-login-submit" style="width:100%; padding:10px; margin-top: 10px;">進入系統</button>
        </div>
    </div>

    <!-- 鎖定關卡提示 Modal -->
    <div id="modal-locked" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div style="font-size: 2.8rem; color: #f59e0b; margin-bottom: 10px;"><i class="fa-solid fa-lock"></i></div>
            <h3 style="margin: 0 0 8px 0; color: #1f2937;">關卡鎖定中</h3>
            <p id="lbl-locked-msg" style="margin: 0 0 20px 0; color: #6b7280; font-size: 0.85rem;">需要先完成填空挑戰才能解鎖此挑戰唷！</p>
            <button id="btn-close-locked-modal" class="btn-3d btn-3d-primary" style="width: 100%; padding: 10px;">我知道了</button>
        </div>
    </div>

    <!-- 課前暖身詢問 Modal -->
    <div id="modal-warmup-ask" class="custom-modal hidden">
        <div class="custom-modal-card">
            <div class="close-icon-circle" id="btn-close-warmup-ask"><i class="fa-solid fa-xmark"></i></div>
            <div style="font-size: 2.5rem; color: var(--duo-blue); margin-bottom: 10px; margin-top: 10px;"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 style="margin: 0 0 8px 0; color: #1f2937;">課前暖身</h3>
            <p style="margin: 0 0 20px 0; color: #6b7280; font-size: 0.9rem;">進入挑戰前，要先進入預習嗎？</p>
            <div style="display: flex; gap: 10px;">
                <button id="btn-warmup-yes" class="btn-3d btn-3d-primary" style="flex: 1; padding: 10px;">進入暖身</button>
                <button id="btn-warmup-no" class="btn-3d btn-3d-secondary" style="flex: 1; padding: 10px;">直接挑戰</button>
            </div>
        </div>
    </div>

    <!-- 主應用容器 -->
    <div class="app-container" id="main-app">
        
        <!-- 首頁頂端資訊列 -->
        <div class="user-meta-bar">
            <div class="user-meta-item" id="btn-profile-trigger">
                <i class="fa-solid fa-user" style="color: var(--duo-blue); font-size: 1.05rem;"></i>
                <span id="lbl-username">訪客</span>
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-fire" style="color: var(--duo-fire-red); font-size: 1.05rem;"></i>
                <span id="lbl-login-days">1</span>天
            </div>

            <div class="user-meta-item">
                <i class="fa-solid fa-star" style="color: var(--duo-gold); font-size: 1.05rem;"></i>
                <span id="lbl-xp">0</span> XP
            </div>

            <div class="user-meta-item" id="btn-level-trigger">
                <span style="color: var(--duo-blue);">1A 韓語</span>
            </div>
        </div>

        <!-- 視圖 1：首頁 / 17單元課程地圖 -->
        <div id="map-view" class="map-container">
            <div id="units-map-list" style="width: 100%; display: flex; flex-direction: column; gap: 16px;"></div>
        </div>

        <!-- 視圖 2：遊戲挑戰視圖 (iframe 嵌入) -->
        <div id="game-view" class="hidden map-container" style="padding: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px;">
                <button id="btn-back-to-map" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                    <i class="fa-solid fa-arrow-left"></i> 返回地圖
                </button>
                <h3 id="game-title" style="margin: 0; font-size: 0.95rem; color: #1f2937;">挑戰中...</h3>
            </div>
            <div id="activity-player-content" style="width:100%; height: 82vh; border-radius: 16px; overflow: hidden; border: 2px solid #e5e7eb;"></div>
        </div>

        <!-- 視圖 3：排行榜視圖 -->
        <div id="profile-view" class="hidden" style="padding: 15px; width: 100%; box-sizing: border-box;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <button id="btn-profile-back-map" class="btn-3d btn-3d-secondary" style="padding: 6px 14px;">
                    <i class="fa-solid fa-arrow-left"></i> 返回地圖
                </button>
                <h3 style="margin: 0; color: #1f2937;">學習排行榜</h3>
            </div>
            
            <div id="leaderboard-container" class="unit-card">
                <p style="text-align: center; color: #6b7280;">載入成績與排行榜中...</p>
            </div>
        </div>

    </div>

    <!-- 核心邏輯 JavaScript -->
    <script>
        // -------- 17 個單元資料庫建立 --------
        const units1AData = [];
        for (let i = 1; i <= 17; i++) {
            const numStr = i < 10 ? '0' + i : i;
            units1AData.push({
                unitNum: i,
                title: `第 ${i} 單元挑戰`,
                stages: [
                    {
                        id: `11-${i}-1_SS`,
                        name: `${i}-1 跟讀`,
                        code: `11-${i}-1 句子跟讀挑戰`,
                        icon: 'fa-microphone',
                        link: `https://yoonakorean.github.io/11${numStr}01SS/`,
                        reqUnlock: null
                    },
                    {
                        id: `11-${i}-1_SF`,
                        name: `${i}-1 填空`,
                        code: `11-${i}-1 句子填空挑戰`,
                        icon: 'fa-pen-to-square',
                        link: `https://yoonakorean.github.io/11${numStr}01SF/`,
                        reqUnlock: null
                    },
                    {
                        id: `11-${i}-1_ST`,
                        name: `${i}-1 聽打`,
                        code: `11-${i}-1 句子聽打挑戰`,
                        icon: 'fa-keyboard',
                        link: `https://yoonakorean.github.io/11${numStr}01ST/`,
                        reqUnlock: `11-${i}-1_SF` // 需先完成填空挑戰
                    }
                ]
            });
        }

        // 狀態管理
        let currentUser = localStorage.getItem('challenge_nickname') || '訪客';
        let userScoresData = {}; // 儲存該使用者的關卡分數
        let currentTargetStage = null;

        // API 連結 (SheetBest)
        const API_URL = "https://api.sheetbest.com/sheets/6609511a-f588-4e4f-bd2b-ed551cab8770";

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lbl-username').innerText = currentUser;
            renderMap();
            fetchUserDataAndLeaderboard();
            setupEventListeners();
        });

        // 繪製地圖
        function renderMap() {
            const container = document.getElementById('units-map-list');
            container.innerHTML = '';

            units1AData.forEach((unit) => {
                const unitCard = document.createElement('div');
                unitCard.className = 'unit-card';

                unitCard.innerHTML = `
                    <div class="unit-header-bar">
                        <div class="unit-header-title">${unit.title}</div>
                        <div style="font-size: 0.85rem;"><i class="fa-solid fa-book"></i> 11-${unit.unitNum}-1</div>
                    </div>
                `;

                const activityCol = document.createElement('div');
                activityCol.className = 'activity-column';

                unit.stages.forEach((stage) => {
                    const nodeWrapper = document.createElement('div');
                    nodeWrapper.className = 'activity-node-wrapper';

                    const btn = document.createElement('button');
                    btn.className = 'activity-node';
                    
                    const score = userScoresData[stage.code] || 0;
                    let isLocked = false;

                    // ST 聽打關卡需填空合格才解鎖
                    if (stage.reqUnlock) {
                        const sfStageCode = `11-${unit.unitNum}-1 句子填空挑戰`;
                        const sfScore = userScoresData[sfStageCode] || 0;
                        if (sfScore <= 0) {
                            isLocked = true;
                        }
                    }

                    if (isLocked) {
                        btn.classList.add('status-locked');
                        btn.innerHTML = `<i class="fa-solid fa-lock"></i>`;
                        btn.onclick = () => {
                            document.getElementById('modal-locked').classList.remove('hidden');
                        };
                    } else {
                        if (score >= 80) btn.classList.add('status-completed');
                        btn.innerHTML = `<i class="fa-solid ${stage.icon}"></i>`;
                        btn.onclick = () => openWarmupAskModal(stage);
                    }

                    nodeWrapper.appendChild(btn);

                    const labelText = document.createElement('div');
                    labelText.className = 'activity-label';
                    labelText.innerText = stage.name;
                    nodeWrapper.appendChild(labelText);

                    if (score > 0) {
                        const scoreBadge = document.createElement('div');
                        scoreBadge.className = 'score-badge';
                        scoreBadge.innerText = `${score}分`;
                        nodeWrapper.appendChild(scoreBadge);
                    }

                    activityCol.appendChild(nodeWrapper);
                });

                unitCard.appendChild(activityCol);
                container.appendChild(unitCard);
            });
        }

        // 暖身彈窗與開啟遊戲
        function openWarmupAskModal(stage) {
            currentTargetStage = stage;
            document.getElementById('modal-warmup-ask').classList.remove('hidden');
        }

        function launchChallenge(stage) {
            document.getElementById('map-view').classList.add('hidden');
            document.getElementById('profile-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('game-title').innerText = stage.code;

            document.getElementById('activity-player-content').innerHTML = `
                <iframe src="${stage.link}" style="width:100%; height:100%; border:none;" allow="microphone; autoplay;"></iframe>
            `;
        }

        // 抓取成績與排行榜
        async function fetchUserDataAndLeaderboard() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                // 解析個人分數
                data.forEach(r => {
                    if (r.nickname && r.nickname.toLowerCase() === currentUser.toLowerCase()) {
                        const unit = (r.gametitle || "").trim();
                        let score = Number(r.score) || 0;
                        if (!userScoresData[unit] || score > userScoresData[unit]) {
                            userScoresData[unit] = score;
                        }
                    }
                });

                // 更新地圖顯示分數
                renderMap();
                // 渲染排行榜表單
                renderLeaderboardTable(data);

            } catch (err) {
                console.error("載入失敗:", err);
            }
        }

        // 排行榜渲染
        function renderLeaderboardTable(data) {
            const userBest = {};
            data.forEach(r => {
                if (!r.nickname) return;
                const unit = (r.gametitle || "").trim();
                let score = Number(r.score) || 0;
                if (!userBest[r.nickname]) userBest[r.nickname] = {};
                if (!userBest[r.nickname][unit] || score > userBest[r.nickname][unit]) {
                    userBest[r.nickname][unit] = score;
                }
            });

            const leaderboard = Object.entries(userBest).map(([name, units]) => {
                const passed = Object.values(units).filter(s => s >= 80);
                const totalScore = Object.values(units).reduce((a, b) => a + b, 0);
                return { name, passCount: passed.length, totalScore };
            });

            leaderboard.sort((a, b) => b.passCount - a.passCount || b.totalScore - a.totalScore);

            let html = `<table><thead><tr><th>名次</th><th>姓名</th><th>通關關卡</th><th>總得分</th></tr></thead><tbody>`;
            leaderboard.slice(0, 10).forEach((u, i) => {
                const isSelf = u.name.toLowerCase() === currentUser.toLowerCase();
                html += `<tr class="${i === 0 ? 'gold' : ''} ${isSelf ? 'self-row' : ''}">
                    <td>${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</td>
                    <td>${u.name}</td>
                    <td>${u.passCount}</td>
                    <td>${u.totalScore}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('leaderboard-container').innerHTML = html;
        }

        // 事件監聽綁定
        function setupEventListeners() {
            document.getElementById('btn-profile-trigger').onclick = () => {
                document.getElementById('map-view').classList.add('hidden');
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('profile-view').classList.remove('hidden');
            };

            document.getElementById('btn-profile-back-map').onclick = () => {
                document.getElementById('profile-view').classList.add('hidden');
                document.getElementById('map-view').classList.remove('hidden');
            };

            document.getElementById('btn-back-to-map').onclick = () => {
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('map-view').classList.remove('hidden');
                document.getElementById('activity-player-content').innerHTML = '';
                fetchUserDataAndLeaderboard(); // 返回地圖時刷新分數
            };

            document.getElementById('btn-close-locked-modal').onclick = () => {
                document.getElementById('modal-locked').classList.add('hidden');
            };

            document.getElementById('btn-close-warmup-ask').onclick = () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
            };

            document.getElementById('btn-warmup-yes').onclick = () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
                launchChallenge(currentTargetStage);
            };

            document.getElementById('btn-warmup-no').onclick = () => {
                document.getElementById('modal-warmup-ask').classList.add('hidden');
                launchChallenge(currentTargetStage);
            };

            // 暱稱設定與切換
            document.getElementById('lbl-username').onclick = () => {
                document.getElementById('login-modal').classList.remove('hidden');
            };

            document.getElementById('btn-login-submit').onclick = () => {
                const name = document.getElementById('nickname-input').value.trim();
                if (name) {
                    currentUser = name;
                    localStorage.setItem('challenge_nickname', name);
                    document.getElementById('lbl-username').innerText = currentUser;
                    document.getElementById('login-modal').classList.add('hidden');
                    userScoresData = {};
                    fetchUserDataAndLeaderboard();
                }
            };
        }
    </script>
</body>
</html>
